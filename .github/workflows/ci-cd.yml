
name: NexusHR Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  
  # 1. Backend Continuous Integration
  backend-ci:
    name: Backend Build & Unit Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexushr_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexushr_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/nexushr_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexushr_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: nexusHrEnterpriseSecretKeyForProductionSecurityWith256BitStrength2026!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x ./nexus-backend/mvnw

      - name: Compile and Run Unit Tests
        run: |
          cd nexus-backend
          ./mvnw clean test

      - name: Verify Backend Docker Build
        run: |
          docker build -t nexus-backend:ci-test ./nexus-backend


  # 2. Frontend Continuous Integration
  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './nexus-frontend/package-lock.json'

      - name: Install NPM Dependencies
        run: |
          cd nexus-frontend
          npm ci

      - name: Production TypeScript & Vite Build
        run: |
          cd nexus-frontend
          npm run build

      - name: Verify Frontend Docker Build
        run: |
          docker build -t nexus-frontend:ci-test ./nexus-frontend


  # 3. Full-Stack Docker Compose Orchestration Check
  orchestration-check:
    name: Docker Compose Multi-Container Smoke Test
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Specification
        run: |
          docker compose config
