apiVersion: v1
kind: ConfigMap
metadata:
  name: nexushr-config
  namespace: nexushr
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service.nexushr.svc.cluster.local:5432/nexushr_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexushr-secrets
  namespace: nexushr
type: Opaque
stringData:
  POSTGRES_DB: "nexushr_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "NexusSecurePassword2026!"
  JWT_SECRET: "NexusHRSuperSecureJWTSecretKeyForEnterpriseProduction2026MustBeAtLeast256BitsLong"