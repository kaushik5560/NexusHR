# Server Configuration
server.port=8080
spring.application.name=nexus-backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexushr_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Kaushik@1234}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
nexushr.app.jwtSecret=${JWT_SECRET:nexusHrEnterpriseSecretKeyForProductionSecurityWith256BitStrength2026!}
nexushr.app.jwtExpirationMs=86400000